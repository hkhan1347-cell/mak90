<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Keepy Uppy 3D | MAK90+</title>
<style>
  html,body{margin:0;height:100%;background:#0a2a8a;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:none;user-select:none}
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block}
  .hud{position:fixed;top:14px;left:0;right:0;text-align:center;pointer-events:none}
  .score{font-size:64px;font-weight:900;text-shadow:0 4px 18px rgba(0,0,0,.45)}
  .best{font-size:14px;letter-spacing:1.5px;text-transform:uppercase;color:#f5b82e;font-weight:700}
  .hint{position:fixed;bottom:18px;left:0;right:0;text-align:center;font-size:14px;color:#c9d6ee;pointer-events:none;text-shadow:0 2px 8px rgba(0,0,0,.5)}
  .msg{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:12px;text-align:center;padding:24px 24px 70px;background:linear-gradient(transparent 35%,rgba(5,12,40,.8) 70%)}
  .msg h1{margin:0;text-shadow:0 3px 14px rgba(0,0,0,.5);font-size:40px;font-weight:900;letter-spacing:-.5px}
  .msg p{margin:0;color:#dfe8ff;font-size:17px;max-width:380px}
  .msg button{margin-top:10px;background:#f5b82e;color:#0a1a4a;border:0;border-radius:10px;padding:14px 30px;font:800 17px system-ui,sans-serif;cursor:pointer}
  .hidden{display:none}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div style="position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 45%,rgba(0,0,20,.55) 100%)"></div>
<div class="hud"><div class="score" id="score">0</div><div class="best" id="best">Best 0</div></div>
<div class="hint">Tap when the ball is close to his feet, chest, shoulders or head</div>
<div class="msg" id="menu">
  <h1>Keepy Uppy 3D</h1>
  <p>Tap when the ball is close to the footballer. The nearest part of his body hits it: feet, chest, shoulders or head. Don't let it touch the pitch.</p>
  <button id="start">Play</button>
</div>
<div class="msg hidden" id="over">
  <h1>Game over</h1>
  <p id="final"></p>
  <button id="again">Play again</button>
</div>
<script src="../lib/three.min.js"></script>
<script>
(function () {
  var best = 0;
  try { best = +localStorage.getItem('ku3_best') || 0; } catch (e) {}
  var scoreEl = document.getElementById('score'), bestEl = document.getElementById('best');
  bestEl.textContent = 'Best ' + best;

  // ---- renderer / scene ----
  var renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), antialias: true });
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  renderer.shadowMap.enabled = true;
  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a2a8a);
  scene.fog = new THREE.Fog(0x0a2a8a, 14, 30);
  var camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
  camera.position.set(0, 1.5, 5.4);
  camera.lookAt(0, 1.4, 0);

  function resize() {
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize); resize();

  scene.add(new THREE.HemisphereLight(0xffffff, 0x2e6b2e, 1.1));
  var sun = new THREE.DirectionalLight(0xffffff, 1.1);
  sun.position.set(3, 8, 5); sun.castShadow = true; scene.add(sun);
  var spot = new THREE.SpotLight(0xffffff, 0.8, 30, Math.PI / 6, 0.6, 1.2);
  spot.position.set(0, 9, 4); spot.target.position.set(0, 1.2, 0); spot.castShadow = true;
  scene.add(spot); scene.add(spot.target);

  // pitch with stripes
  var stripeCanvas = document.createElement('canvas'); stripeCanvas.width = 256; stripeCanvas.height = 256;
  var sc = stripeCanvas.getContext('2d');
  for (var i = 0; i < 8; i++) { sc.fillStyle = i % 2 ? '#2e8b3e' : '#278036'; sc.fillRect(0, i * 32, 256, 32); }
  var grassTex = new THREE.CanvasTexture(stripeCanvas); grassTex.wrapS = grassTex.wrapT = THREE.RepeatWrapping; grassTex.repeat.set(6, 6);
  var pitch = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshLambertMaterial({ map: grassTex }));
  pitch.rotation.x = -Math.PI / 2; pitch.receiveShadow = true; scene.add(pitch);

  // ---- footballer (stylised, big-head proportions) ----
  var player = new THREE.Group(); scene.add(player);
  function std(c, r) { return new THREE.MeshStandardMaterial({ color: c, roughness: r === undefined ? 0.7 : r, metalness: 0 }); }
  function add(parent, geo, m, x, y, z) { var o = new THREE.Mesh(geo, m); o.position.set(x, y, z); o.castShadow = true; parent.add(o); return o; }

  var NAVY = 0x1c2d6b, WHITE = 0xffffff, SKIN = std(0xc98d63, 0.55);
  var shirt = std(NAVY, 0.45), trim = std(WHITE, 0.4), shorts = std(WHITE, 0.45), sockNavy = std(NAVY, 0.5);
  var boot = std(0x5a6066, 0.35), bootSole = std(0x1a1a1a, 0.5), hair = std(0x3b2414, 0.85);

  var body = new THREE.Group(); player.add(body);
  // torso: short V-neck jersey
  add(body, new THREE.CylinderGeometry(0.36, 0.28, 0.8, 24), shirt, 0, 1.4, 0);
  // white V-neck trim (thin ring)
  add(body, new THREE.TorusGeometry(0.2, 0.02, 8, 24, Math.PI), trim, 0, 1.78, 0.28).rotation.set(0, 0, Math.PI);
  // shoulders
  add(body, new THREE.SphereGeometry(0.16, 16, 12), shirt, -0.36, 1.7, 0);
  add(body, new THREE.SphereGeometry(0.16, 16, 12), shirt, 0.36, 1.7, 0);
  // neck
  add(body, new THREE.CylinderGeometry(0.14, 0.16, 0.14, 12), SKIN, 0, 1.86, 0);
  // big stylised head
  add(body, new THREE.SphereGeometry(0.45, 28, 20), SKIN, 0, 2.2, 0);
  add(body, new THREE.SphereGeometry(0.47, 24, 14, 0, Math.PI * 2, 0, Math.PI / 2.3), hair, 0, 2.27, -0.02);
  // spiky cartoon hair tufts
  [[-0.18, 2.62, -0.02, -0.35], [0.02, 2.66, -0.04, 0.0], [0.2, 2.6, -0.02, 0.35]].forEach(function (t) {
    var cone = add(body, new THREE.ConeGeometry(0.13, 0.32, 10), hair, t[0], t[1], t[2]);
    cone.rotation.z = -t[3];
  });
  // ears
  add(body, new THREE.SphereGeometry(0.08, 10, 8), SKIN, -0.44, 2.2, 0);
  add(body, new THREE.SphereGeometry(0.08, 10, 8), SKIN, 0.44, 2.2, 0);
  // face photo curved onto the head (the cap and beard are in the photo)
  // USE_PHOTO = true puts your photo on the head; false draws an original cartoon face
  var USE_PHOTO = false, faceTex;
  if (USE_PHOTO) {
    faceTex = new THREE.TextureLoader().load('face.png');
  } else {
    var fc = document.createElement('canvas'); fc.width = 288; fc.height = 400;
    var g = fc.getContext('2d');
    // skin oval with soft shading so the face has depth
    var sk = g.createRadialGradient(130, 190, 30, 144, 200, 170);
    sk.addColorStop(0, '#d89a6e'); sk.addColorStop(0.7, '#c98d63'); sk.addColorStop(1, 'rgba(201,141,99,0)');
    g.fillStyle = sk; g.beginPath(); g.ellipse(144, 200, 136, 186, 0, 0, Math.PI * 2); g.fill();
    // eyes: almond shape, upper lid line, lashes, iris with depth
    function eye(x, y, flip) {
      g.save(); g.translate(x, y); g.scale(flip, 1);
      g.fillStyle = '#ffffff'; g.beginPath(); g.ellipse(0, 0, 28, 22, 0, 0, Math.PI * 2); g.fill();
      var iris = g.createRadialGradient(4, 2, 2, 4, 2, 17);
      iris.addColorStop(0, '#6b3f1f'); iris.addColorStop(1, '#2a1608');
      g.fillStyle = iris; g.beginPath(); g.arc(4, 2, 16, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#0c0a08'; g.beginPath(); g.arc(4, 2, 7, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#ffffff'; g.beginPath(); g.arc(-1, -4, 4.5, 0, Math.PI * 2); g.fill();
      g.strokeStyle = '#1a1210'; g.lineWidth = 6; g.beginPath(); g.ellipse(0, 0, 28, 22, 0, Math.PI * 1.05, Math.PI * 1.95); g.stroke();
      g.lineWidth = 3; g.beginPath(); g.moveTo(-22, -10); g.quadraticCurveTo(0, -36, 24, -12); g.stroke();
      g.beginPath(); g.moveTo(-22, -10); g.lineTo(-27, -18); g.moveTo(-8, -28); g.lineTo(-10, -36); g.moveTo(10, -28); g.lineTo(12, -35); g.stroke();
      g.strokeStyle = 'rgba(40,25,15,0.45)'; g.lineWidth = 2.5; g.beginPath(); g.moveTo(-26, -14); g.quadraticCurveTo(0, -30, 26, -16); g.stroke();
      g.restore();
    }
    eye(96, 190, 1); eye(192, 190, -1);
    // brows: tapered, thicker at the inner end
    g.fillStyle = '#2b1a10';
    function brow(x1, y1, x2, y2, x3, y3) {
      g.beginPath(); g.moveTo(x1, y1); g.quadraticCurveTo(x2, y2 - 12, x3, y3); g.quadraticCurveTo(x2, y2 - 6, x1, y1 + 4); g.fill();
    }
    brow(62, 150, 96, 128, 128, 140); brow(226, 150, 192, 128, 160, 140);
    // nose: shaded side, soft nostrils
    g.strokeStyle = 'rgba(120,70,40,0.55)'; g.lineWidth = 5; g.lineCap = 'round';
    g.beginPath(); g.moveTo(152, 200); g.quadraticCurveTo(160, 236, 144, 250); g.stroke();
    g.fillStyle = 'rgba(90,45,25,0.5)';
    g.beginPath(); g.ellipse(136, 252, 7, 4, 0, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.ellipse(152, 252, 7, 4, 0, 0, Math.PI * 2); g.fill();
    // lips: upper and lower with highlight
    g.fillStyle = '#b5566a';
    g.beginPath(); g.moveTo(102, 278); g.quadraticCurveTo(124, 284, 144, 286); g.quadraticCurveTo(164, 284, 186, 278); g.quadraticCurveTo(144, 296, 102, 278); g.fill();
    g.fillStyle = '#c96a7a';
    g.beginPath(); g.moveTo(102, 278); g.quadraticCurveTo(144, 294, 186, 278); g.quadraticCurveTo(176, 312, 144, 316); g.quadraticCurveTo(112, 312, 102, 278); g.fill();
    g.fillStyle = 'rgba(255,255,255,0.35)'; g.beginPath(); g.ellipse(134, 302, 12, 3, 0, 0, Math.PI * 2); g.fill();
    // smile lines and cheek blush
    g.strokeStyle = 'rgba(120,70,40,0.45)'; g.lineWidth = 3;
    g.beginPath(); g.moveTo(88, 270); g.quadraticCurveTo(80, 288, 96, 300); g.stroke();
    g.beginPath(); g.moveTo(200, 270); g.quadraticCurveTo(208, 288, 192, 300); g.stroke();
    var bl = g.createRadialGradient(0, 0, 2, 0, 0, 30);
    bl.addColorStop(0, 'rgba(255,120,110,0.5)'); bl.addColorStop(1, 'rgba(255,120,110,0)');
    g.save(); g.translate(72, 258); g.fillStyle = bl; g.beginPath(); g.arc(0, 0, 30, 0, Math.PI * 2); g.fill(); g.restore();
    g.save(); g.translate(216, 258); g.fillStyle = bl; g.beginPath(); g.arc(0, 0, 30, 0, Math.PI * 2); g.fill(); g.restore();
    faceTex = new THREE.CanvasTexture(fc);
  }
  var faceGeo = new THREE.PlaneGeometry(0.72, 1.0, 16, 20), fp = faceGeo.attributes.position;
  for (var vi = 0; vi < fp.count; vi++) {
    var fx = fp.getX(vi), fy = fp.getY(vi), rr = 0.46;
    fp.setZ(vi, Math.sqrt(Math.max(0, rr * rr - fx * fx * 0.8 - fy * fy * 0.6)) - 0.2);
  }
  faceGeo.computeVertexNormals();
  var faceMesh = new THREE.Mesh(faceGeo, new THREE.MeshStandardMaterial({ map: faceTex, transparent: true, alphaTest: 0.05, roughness: 0.8 }));
  faceMesh.position.set(0, 2.2, 0.2);
  body.add(faceMesh);
  // shorts
  add(body, new THREE.CylinderGeometry(0.38, 0.36, 0.34, 24), shorts, 0, 0.92, 0);
  // arms: short and rounded
  [-1, 1].forEach(function (sd) {
    add(body, new THREE.CylinderGeometry(0.1, 0.085, 0.42, 14), shirt, sd * 0.44, 1.38, 0);      // short sleeve
    add(body, new THREE.CylinderGeometry(0.08, 0.07, 0.36, 14), SKIN, sd * 0.46, 1.0, 0.02);     // forearm
    add(body, new THREE.SphereGeometry(0.09, 12, 10), SKIN, sd * 0.47, 0.78, 0.04);              // hand
  });

  // legs: hip pivot; foot touches the ground at pivot.y - 0.7
  function leg(x) {
    var pivot = new THREE.Group(); pivot.position.set(x, 0.7, 0); body.add(pivot);
    add(pivot, new THREE.CylinderGeometry(0.13, 0.11, 0.3, 16), SKIN, 0, -0.14, 0);          // thigh below shorts
    add(pivot, new THREE.CylinderGeometry(0.12, 0.09, 0.3, 16), sockNavy, 0, -0.38, 0);      // sock
    add(pivot, new THREE.CylinderGeometry(0.125, 0.125, 0.04, 16), trim, 0, -0.27, 0);        // white sock top
    add(pivot, new THREE.CylinderGeometry(0.125, 0.125, 0.04, 16), trim, 0, -0.5, 0);         // white sock stripe
    add(pivot, new THREE.BoxGeometry(0.2, 0.14, 0.36), boot, 0, -0.6, 0.08);                   // boot
    add(pivot, new THREE.BoxGeometry(0.22, 0.05, 0.38), bootSole, 0, -0.69, 0.08);             // sole
    return pivot;
  }
  var legL = leg(-0.16), legR = leg(0.16);

  // body parts that can touch the ball (approximate world positions)
  var parts = {
    footR:    { p: new THREE.Vector3( 0.16, 0.5, 0.55), type: 'foot',     leg: 'R', vy: [7.2, 8.4] },
    footL:    { p: new THREE.Vector3(-0.16, 0.5, 0.55), type: 'foot',     leg: 'L', vy: [7.0, 8.0] },
    chest:    { p: new THREE.Vector3( 0,    1.4, 0.35), type: 'chest',                vy: [6.8, 7.6] },
    shoulderR:{ p: new THREE.Vector3( 0.36, 1.7, 0.1),  type: 'shoulder', side:  1, vy: [6.8, 7.6] },
    shoulderL:{ p: new THREE.Vector3(-0.36, 1.7, 0.1),  type: 'shoulder', side: -1, vy: [6.8, 7.6] },
    head:     { p: new THREE.Vector3( 0,    2.25, 0.35), type: 'head',                vy: [6.4, 7.4] }
  };

  // ---- ball ----
  var bc = document.createElement('canvas'); bc.width = 256; bc.height = 256;
  var bx = bc.getContext('2d');
  bx.fillStyle = '#fff'; bx.fillRect(0, 0, 256, 256);
  bx.fillStyle = '#0a1a4a';
  for (var k = 0; k < 10; k++) { var a = k * Math.PI / 5; bx.beginPath(); bx.arc(128 + Math.cos(a) * 110, 128 + Math.sin(a) * 110, 34, 0, 7); bx.fill(); }
  bx.beginPath(); bx.arc(128, 128, 52, 0, 7); bx.fill();
  var ball = new THREE.Mesh(new THREE.SphereGeometry(0.22, 24, 18), new THREE.MeshLambertMaterial({ map: new THREE.CanvasTexture(bc) }));
  ball.castShadow = true; scene.add(ball);

  // ---- game state ----
  var G = 9.8, ballR = 0.22, HIT_RANGE = 1.6;
  var state = 'menu', score = 0, pos = new THREE.Vector3(), vel = new THREE.Vector3();
  var anim = null;   // { key, t } while a body part is hitting the ball
  var idleL = 0;

  function reset() {
    pos.set(0, 3.2, 0); vel.set(0.6, 0, 0.2);
    score = 0; scoreEl.textContent = '0'; anim = null;
  }

  // the body part closest to the ball hits it
  function tap() {
    if (state !== 'play') return;
    var bestKey = null, bestD = Infinity;
    for (var key in parts) {
      var d = pos.distanceTo(parts[key].p);
      if (d < bestD) { bestD = d; bestKey = key; }
    }
    if (bestD > HIT_RANGE) return;                 // ball is too far from every part
    var part = parts[bestKey];
    var s = part.vy[0] + Math.random() * (part.vy[1] - part.vy[0]);
    vel.y = s;
    vel.x = (Math.random() - 0.5) * 2.2;
    vel.z = (Math.random() - 0.5) * 1.2;
    anim = { key: bestKey, t: 0 };
    score++; scoreEl.textContent = score;
  }

  function start() {
    reset(); state = 'play';
    document.getElementById('menu').classList.add('hidden');
    document.getElementById('over').classList.add('hidden');
  }
  function end() {
    state = 'over';
    if (score > best) { best = score; try { localStorage.setItem('ku3_best', best); } catch (e) {} }
    bestEl.textContent = 'Best ' + best;
    document.getElementById('final').textContent = 'You kept it up ' + score + ' times. Best: ' + best + '.';
    document.getElementById('over').classList.remove('hidden');
  }
  renderer.domElement.addEventListener('pointerdown', function (e) { e.preventDefault(); tap(); });
  document.getElementById('start').addEventListener('click', start);
  document.getElementById('again').addEventListener('click', start);

  // ---- loop ----
  var last = performance.now();
  function frame(now) {
    var dt = Math.min(0.033, (now - last) / 1000); last = now;
    if (state === 'play') {
      vel.y -= G * dt;
      pos.addScaledVector(vel, dt);
      if (pos.x < -2.4) { pos.x = -2.4; vel.x = Math.abs(vel.x) * 0.8; }
      if (pos.x > 2.4) { pos.x = 2.4; vel.x = -Math.abs(vel.x) * 0.8; }
      pos.z = Math.max(-1.5, Math.min(1.8, pos.z));
      if (pos.y < ballR) { end(); pos.y = ballR; }
    }
    ball.position.copy(pos);
    ball.rotation.x += vel.z * dt * 2; ball.rotation.z -= vel.x * dt * 2;

    // idle sway, then the hitting animation for the part that touched the ball
    idleL = Math.sin(now / 400) * 0.05;
    legL.rotation.x = idleL; legR.rotation.x = 0;
    body.rotation.x = 0; body.rotation.z = 0;
    if (anim) {
      anim.t += dt * 3;
      var k2 = Math.min(anim.t, 1), sw = Math.sin(k2 * Math.PI), part = parts[anim.key];
      if (part.type === 'foot') {
        (part.leg === 'R' ? legR : legL).rotation.x = -sw * 1.4;
      } else if (part.type === 'head') {
        body.rotation.x = -sw * 0.35;                  // head goes back, then forward
      } else if (part.type === 'chest') {
        body.rotation.x = -sw * 0.15;                  // chest pushes out
      } else if (part.type === 'shoulder') {
        body.rotation.z = part.side * sw * 0.2;        // shoulder dips into the ball
      }
      if (anim.t >= 1) anim = null;
    }

    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  reset();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
