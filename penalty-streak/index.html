<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Penalty Streak</title>
<style>
  html,body{margin:0;height:100%;background:#070b18;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#fff;user-select:none;-webkit-user-select:none;touch-action:none}
  body{display:flex;align-items:center;justify-content:center}
  #wrap{position:relative;width:min(96vw,480px);aspect-ratio:480/640;border-radius:16px;overflow:hidden;box-shadow:0 12px 50px #000c;cursor:pointer;background:#0a1530}
  #gl,#ui{position:absolute;inset:0;width:100%;height:100%;display:block}
  #ui{pointer-events:none}
  #ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box;background:radial-gradient(circle at 50% 30%,rgba(20,50,110,.88),rgba(5,10,25,.94))}
  #ovTitle{margin:0;font-size:42px;font-weight:900;letter-spacing:3px;text-shadow:0 0 22px #3ab8ff}
  #ovBody{margin:16px 0 0;font-size:15px;line-height:1.6;opacity:.92}
  #opts{margin-top:18px;display:none;flex-direction:column;gap:10px;align-items:center}
  .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .opt{background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.25);color:#dde;font-weight:700;font-size:13px;letter-spacing:.5px;padding:9px 14px;border-radius:10px;cursor:pointer}
  .opt.on{background:#fff;color:#0b1a3a;border-color:#fff}
  #go{margin-top:22px;background:linear-gradient(#5cc2ff,#1d6fdc);border:0;color:#fff;font-size:20px;font-weight:800;letter-spacing:1px;padding:14px 44px;border-radius:999px;cursor:pointer;box-shadow:0 8px 26px #2a86ff77}
  #go:hover{filter:brightness(1.1)}
  #go:active{transform:translateY(3px)}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="gl"></canvas>
  <canvas id="ui"></canvas>
  <div id="ov">
    <h1 id="ovTitle">PENALTY STREAK</h1>
    <p id="ovBody"></p>
    <div id="opts"></div>
    <button id="go">KICK OFF</button>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  if (typeof THREE === 'undefined') {
    document.getElementById('wrap').innerHTML = '<p style="padding:24px">The 3D library could not load. Check your connection and reload.</p>';
    return;
  }

  // ---------- DOM ----------
  const wrap = document.getElementById('wrap');
  const glCanvas = document.getElementById('gl');
  const uiCanvas = document.getElementById('ui');
  const uiCtx = uiCanvas.getContext('2d');
  const ov = document.getElementById('ov');
  const ovTitle = document.getElementById('ovTitle');
  const ovBody = document.getElementById('ovBody');
  const optsEl = document.getElementById('opts');
  const btn = document.getElementById('go');

  // ---------- game constants (2D "logical" space is 480 x 640) ----------
  const W = 480, H = 640, KICKS = 5, FLIGHT = 0.55, DIVE_TIME = 1.6;
  const RUN_TIME = 0.45, KICK_WAIT = 0.55;
  const GOAL = { l: 80, r: 400, t: 120, b: 250 };
  const SPOT = { x: 240, y: 470 };
  const ZONES = [150, 240, 330];
  const ZONE_BANDS = [
    { x0: 80,  x1: 195, c: 150, label: 'LEFT' },
    { x0: 195, x1: 285, c: 240, label: 'CENTRE' },
    { x0: 285, x1: 400, c: 330, label: 'RIGHT' }
  ];
  const PLAYERS = {
    striker:  { name: 'STRIKER',  aimSpeed: 2.8, pwSpeed: 3.6, jitter: 22, maxPow: 1.0 },
    finisher: { name: 'FINISHER', aimSpeed: 2.0, pwSpeed: 2.6, jitter: 5,  maxPow: 0.85 }
  };

  // 3D world: goal line at z=0, penalty spot at z=11, goal 7.32m wide, 2.44m high
  const PX2W = 3.66 / 160;                 // logical px -> metres (x)
  const SPOT_Z = 11, BAR_H = 2.44;
  const pxToW = px => (px - 240) * PX2W;
  const tyToH = ty => (252 - ty) / 136 * BAR_H;

  // ---------- persistence ----------
  let bestStreakSaved = 0, bestScoreSaved = 0;
  try {
    bestStreakSaved = +localStorage.getItem('ps_bestStreak') || 0;
    bestScoreSaved = +localStorage.getItem('ps_bestScore') || 0;
  } catch (e) {}
  function saveBests() {
    try {
      localStorage.setItem('ps_bestStreak', bestStreakSaved);
      localStorage.setItem('ps_bestScore', bestScoreSaved);
    } catch (e) {}
  }

  // ---------- sound ----------
  let ac = null;
  function ensureAC() {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (ac && ac.state === 'suspended') ac.resume();
  }
  function tone(f, d, type, v, slide) {
    if (!ac) return;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f, ac.currentTime);
    if (slide) o.frequency.exponentialRampToValueAtTime(f * slide, ac.currentTime + d);
    g.gain.setValueAtTime(v || 0.15, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + d);
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime + d);
  }
  function crowd(d, v) {
    if (!ac) return;
    const n = Math.floor(ac.sampleRate * d);
    const buf = ac.createBuffer(1, n, ac.sampleRate);
    const c = buf.getChannelData(0);
    for (let i = 0; i < n; i++) c[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
    const src = ac.createBufferSource(), g = ac.createGain();
    g.gain.value = v;
    src.buffer = buf; src.connect(g); g.connect(ac.destination); src.start();
  }

  // ---------- state ----------
  const S = {
    state: 'menu',         // menu | aim | power | dive | flight | result | over
    player: 'striker',
    sudden: true,
    time: 0,
    turn: 'user',
    shooter: 'user',       // who is kicking now (also picks the camera)
    userTaken: 0, aiTaken: 0,
    userG: 0, aiG: 0,
    userRes: [], aiRes: [],
    score: 0, streak: 0,
    bestStreak: bestStreakSaved, bestScore: bestScoreSaved,
    aimX: 240, lockedX: 240, pw: 0,
    flightT: 0, tx: 240, ty: 200,
    kickWait: 0, shooterActive: false, shooterT: 0,
    keeperX: 240, keeperTarget: 240,
    saved: false, scored: false, overBar: false,
    resultT: 0, diveT: 0, shake: 0,
    banner: null, particles: []
  };

  function difficulty() {
    return Math.min(1, S.streak * 0.08 + (S.userTaken / KICKS) * 0.2);
  }
  function zoneAt(x) {
    return x < 195 ? 150 : (x < 285 ? 240 : 330);
  }
  function isSuddenDeath() {
    return S.userTaken >= KICKS && S.aiTaken >= KICKS;
  }

  // ---------- menu ----------
  function makeOpt(label, active, onClick) {
    const b = document.createElement('button');
    b.className = 'opt' + (active ? ' on' : '');
    b.textContent = label;
    b.addEventListener('click', e => { e.stopPropagation(); onClick(); });
    return b;
  }
  function renderOpts() {
    optsEl.innerHTML = '';
    const r1 = document.createElement('div'); r1.className = 'row';
    Object.keys(PLAYERS).forEach(k => {
      r1.appendChild(makeOpt(PLAYERS[k].name, S.player === k, () => { S.player = k; renderOpts(); }));
    });
    const r2 = document.createElement('div'); r2.className = 'row';
    r2.appendChild(makeOpt('SUDDEN DEATH ON', S.sudden, () => { S.sudden = true; renderOpts(); }));
    r2.appendChild(makeOpt('SUDDEN DEATH OFF', !S.sudden, () => { S.sudden = false; renderOpts(); }));
    optsEl.appendChild(r1);
    optsEl.appendChild(r2);
  }
  function showMenu() {
    S.state = 'menu';
    ov.style.display = 'flex';
    optsEl.style.display = 'flex';
    ovTitle.textContent = 'PENALTY STREAK';
    ovBody.innerHTML =
      'Five kicks each, you and the AI, alternating.<br>' +
      'You shoot: tap to lock aim, tap again for power.<br>' +
      'AI shoots: tap a zone (or use the arrow keys) to dive.<br><br>' +
      'Best streak: <b>' + S.bestStreak + '</b> &nbsp;·&nbsp; Best score: <b>' + S.bestScore + '</b>';
    renderOpts();
    btn.textContent = 'KICK OFF';
  }
  function endMatch() {
    S.state = 'over';
    const isNew = S.score > S.bestScore;
    if (isNew) S.bestScore = S.score;
    if (S.bestStreak > bestStreakSaved) bestStreakSaved = S.bestStreak;
    if (S.bestScore > bestScoreSaved) bestScoreSaved = S.bestScore;
    saveBests();
    const verdict = S.userG > S.aiG ? 'YOU WIN!' : (S.userG < S.aiG ? 'AI WINS' : 'DRAW');
    ov.style.display = 'flex';
    optsEl.style.display = 'none';
    ovTitle.textContent = verdict;
    ovBody.innerHTML =
      'Final score: <b>You ' + S.userG + ' - ' + S.aiG + ' AI</b><br>' +
      'Points: <b>' + S.score + '</b><br>' +
      'Best streak: <b>' + S.bestStreak + '</b>' +
      (isNew && S.score > 0 ? '<br><br><span style="color:#ffd33d">New high score!</span>' : '');
    btn.textContent = 'PLAY AGAIN';
  }

  // ---------- match flow ----------
  function startMatch() {
    ensureAC();
    Object.assign(S, {
      userTaken: 0, aiTaken: 0, userG: 0, aiG: 0,
      userRes: [], aiRes: [], score: 0, streak: 0,
      turn: 'user', particles: [], banner: null, resultT: 0, shake: 0,
      shooterActive: false, kickWait: 0, flightT: 0
    });
    ov.style.display = 'none';
    optsEl.style.display = 'none';
    nextKick();
  }
  function nextKick() {
    S.keeperTarget = 240;
    S.shooterActive = false;
    S.flightT = 0;
    if (S.turn === 'user') {
      S.shooter = 'user';
      S.state = 'aim';
    } else {
      S.shooter = 'ai';
      S.state = 'dive';
      S.diveT = DIVE_TIME;
    }
  }
  function checkOver() {
    const uRem = Math.max(0, KICKS - S.userTaken);
    const aRem = Math.max(0, KICKS - S.aiTaken);
    if (S.userTaken < KICKS || S.aiTaken < KICKS) {
      return S.userG > S.aiG + aRem || S.aiG > S.userG + uRem;
    }
    if (S.userTaken !== S.aiTaken) return false;
    if (S.userG !== S.aiG) return true;
    return !S.sudden;
  }
  function finishKick() {
    S.turn = S.shooter === 'user' ? 'ai' : 'user';
    if (checkOver()) return endMatch();
    nextKick();
  }

  // ---------- shots ----------
  function computeShot(tx, ty) {
    S.tx = tx; S.ty = ty;
    const inside = tx > GOAL.l + 4 && tx < GOAL.r - 4 && ty > GOAL.t + 4 && ty <= GOAL.b + 2;
    const reach = 66 - (ty < 165 ? 8 : 0);
    S.saved = inside && Math.abs(tx - S.keeperTarget) < reach;
    S.scored = inside && !S.saved;
    S.overBar = ty <= GOAL.t + 4;
  }
  function startKick() {
    S.shooterActive = true;
    S.shooterT = 0;
    S.kickWait = RUN_TIME + 0.1;
  }
  function lockAim() {
    const P = PLAYERS[S.player];
    S.lockedX = Math.max(90, Math.min(390, S.aimX + (Math.random() * 2 - 1) * P.jitter));
    S.state = 'power';
    tone(660, 0.08, 'square', 0.07);
    const pRead = Math.min(0.9, 0.3 + S.streak * 0.08 + S.userTaken * 0.04);
    if (Math.random() < pRead) {
      S.keeperTarget = ZONES.reduce((a, b) => Math.abs(b - S.lockedX) < Math.abs(a - S.lockedX) ? b : a);
    } else {
      S.keeperTarget = ZONES[Math.floor(Math.random() * ZONES.length)];
    }
  }
  function lockPower() {
    const P = PLAYERS[S.player];
    computeShot(S.lockedX, 252 - S.pw * P.maxPow * 136);
    S.state = 'flight';
    S.flightT = 0;
    startKick();
    tone(180, 0.09, 'triangle', 0.3, 0.5);
  }
  function startAIShot() {
    let x, y;
    if (Math.random() < 0.15) {
      x = Math.random() < 0.5 ? 40 : 440; y = 200;
    } else {
      x = Math.random() < 0.5 ? 100 + Math.random() * 90 : 290 + Math.random() * 100;
      y = 125 + Math.random() * 120;
    }
    computeShot(x, y);
    S.state = 'flight';
    S.flightT = 0;
    startKick();
    tone(150, 0.1, 'triangle', 0.25, 0.5);
  }

  function spawn(x, y, n, colors, spd, up) {
    for (let i = 0; i < n; i++) {
      S.particles.push({
        x: x, y: y,
        vx: (Math.random() - 0.5) * spd,
        vy: up ? -Math.random() * spd : (Math.random() - 0.5) * spd,
        life: 1,
        c: colors[(Math.random() * colors.length) | 0]
      });
    }
  }
  function setBanner(text, color) {
    S.banner = { text: text, color: color, life: 1.3, max: 1.3 };
  }
  function resolveShot() {
    S.shooterActive = false;
    if (S.shooter === 'user') {
      S.userTaken++;
      if (S.saved) {
        S.streak = 0;
        S.userRes.push('s');
        setBanner('SAVED!', '#ffa940');
        tone(170, 0.35, 'sawtooth', 0.12, 0.4);
        spawn(240, 230, 22, ['#ddd', '#bbb'], 4, false);
      } else if (S.scored) {
        S.streak++;
        S.userG++;
        const pts = 100 * (1 + Math.floor((S.streak - 1) / 2));
        S.score += pts;
        S.bestStreak = Math.max(S.bestStreak, S.streak);
        S.userRes.push('g');
        setBanner('GOAL! +' + pts, '#5dff8a');
        tone(523, 0.25, 'triangle', 0.2);
        tone(784, 0.3, 'triangle', 0.12);
        crowd(0.9, 0.18);
        spawn(240, 200, 70, ['#fff', '#ffd33d', '#4fb3ff', '#5dff8a', '#ff6b6b'], 12, true);
        S.shake = 9;
      } else {
        S.streak = 0;
        S.userRes.push('x');
        setBanner(S.overBar ? 'OVER THE BAR!' : 'WIDE!', '#ff6b6b');
        tone(200, 0.25, 'square', 0.1, 0.5);
      }
    } else {
      S.aiTaken++;
      if (S.scored) {
        S.aiG++;
        S.aiRes.push('g');
        setBanner('AI SCORES', '#ff6b6b');
        tone(300, 0.35, 'sawtooth', 0.12, 0.5);
        crowd(0.7, 0.1);
      } else if (S.saved) {
        S.aiRes.push('s');
        setBanner('YOU SAVED IT!', '#5dff8a');
        tone(880, 0.2, 'triangle', 0.15);
        spawn(240, 200, 40, ['#5dff8a', '#fff'], 9, true);
        S.shake = 5;
      } else {
        S.aiRes.push('x');
        setBanner('AI MISSES!', '#cfd6e6');
      }
    }
    S.state = 'result';
    S.resultT = 1.3;
  }

  // ---------- input ----------
  function pointerX(e) {
    const r = wrap.getBoundingClientRect();
    return (e.clientX - r.left) / r.width * W;
  }
  function tap(e) {
    if (S.state === 'aim') lockAim();
    else if (S.state === 'power') lockPower();
    else if (S.state === 'dive' && e) S.keeperTarget = zoneAt(pointerX(e));
  }
  wrap.addEventListener('pointerdown', e => {
    if (ov.style.display !== 'none') return;
    e.preventDefault();
    tap(e);
  });
  btn.addEventListener('click', () => startMatch());
  window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'Enter') {
      e.preventDefault();
      if ((S.state === 'menu' || S.state === 'over') && ov.style.display !== 'none') startMatch();
      else tap(null);
    } else if (S.state === 'dive') {
      if (e.code === 'ArrowLeft') S.keeperTarget = 150;
      else if (e.code === 'ArrowRight') S.keeperTarget = 330;
      else if (e.code === 'ArrowDown' || e.code === 'ArrowUp') S.keeperTarget = 240;
    }
  });

  // ---------- 3D scene ----------
  const renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: true });
  renderer.shadowMap.enabled = false;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a1530);
  scene.fog = new THREE.Fog(0x0a1530, 45, 110);
  const camera = new THREE.PerspectiveCamera(58, W / H, 0.1, 300);

  const hemi = new THREE.HemisphereLight(0xbfe3ff, 0x2f6b2f, 0.9);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xffffff, 0.7);
  sun.position.set(-6, 14, 10);
  scene.add(sun);

  function mat(color, rough) {
    return new THREE.MeshStandardMaterial({ color: color, roughness: rough === undefined ? 0.7 : rough, metalness: 0 });
  }

  // pitch with mowing stripes
  (function buildPitch() {
    const c = document.createElement('canvas');
    c.width = 8; c.height = 8;
    const cx = c.getContext('2d');
    cx.fillStyle = '#3c9d46'; cx.fillRect(0, 0, 8, 4);
    cx.fillStyle = '#338c3c'; cx.fillRect(0, 4, 8, 4);
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(1, 40);
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ map: tex, roughness: 0.9 }));
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);
  })();

  const whiteMat = mat(0xffffff, 0.5);
  function line(x1, z1, x2, z2) {
    const len = Math.hypot(x2 - x1, z2 - z1);
    const m = new THREE.Mesh(new THREE.BoxGeometry(len, 0.01, 0.12), whiteMat);
    m.position.set((x1 + x2) / 2, 0.006, (z1 + z2) / 2);
    m.rotation.y = -Math.atan2(z2 - z1, x2 - x1);
    scene.add(m);
  }
  // penalty area, six-yard box, goal line
  line(-20.15, 16.5, 20.15, 16.5);
  line(-20.15, 0, -20.15, 16.5);
  line(20.15, 0, 20.15, 16.5);
  line(-9.16, 5.5, 9.16, 5.5);
  line(-9.16, 0, -9.16, 5.5);
  line(9.16, 0, 9.16, 5.5);
  line(-30, 0, 30, 0);
  // penalty arc (outside the box)
  (function () {
    const ring = new THREE.Mesh(
      new THREE.RingGeometry(9.09, 9.15, 48, 1, -2.498, 1.855),
      new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide })
    );
    ring.rotation.x = -Math.PI / 2;
    ring.position.set(0, 0.007, SPOT_Z);
    scene.add(ring);
  })();
  // penalty spot
  (function () {
    const dot = new THREE.Mesh(new THREE.CircleGeometry(0.22, 16), new THREE.MeshBasicMaterial({ color: 0xffffff }));
    dot.rotation.x = -Math.PI / 2;
    dot.position.set(0, 0.008, SPOT_Z);
    scene.add(dot);
  })();

  // goal: posts, bar and net
  (function buildGoal() {
    const postGeo = new THREE.CylinderGeometry(0.06, 0.06, BAR_H, 12);
    const postL = new THREE.Mesh(postGeo, whiteMat); postL.position.set(-3.66, BAR_H / 2, 0); scene.add(postL);
    const postR = new THREE.Mesh(postGeo, whiteMat); postR.position.set(3.66, BAR_H / 2, 0); scene.add(postR);
    const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 7.32, 12), whiteMat);
    bar.rotation.z = Math.PI / 2;
    bar.position.set(0, BAR_H, 0);
    scene.add(bar);

    const pts = [];
    const push = (a, b, c, d, e, f) => pts.push(a, b, c, d, e, f);
    const depth = -2;
    for (let x = -3.66; x <= 3.66 + 1e-6; x += 0.305) {
      push(x, 0, depth, x, BAR_H, depth);       // back vertical
      push(x, BAR_H, 0, x, BAR_H, depth);       // roof
    }
    for (let y = 0; y <= BAR_H + 1e-6; y += 0.305) {
      push(-3.66, y, depth, 3.66, y, depth);    // back horizontal
      push(-3.66, y, 0, -3.66, y, depth);       // left side
      push(3.66, y, 0, 3.66, y, depth);         // right side
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
    scene.add(new THREE.LineSegments(geo, new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.35 })));
  })();

  // crowd behind the goal
  (function buildCrowd() {
    const colors = [0xd62e2e, 0x1d5fd6, 0xffffff, 0xffd21f, 0x2e9d4a, 0x7a3fd6];
    const mats = colors.map(c => mat(c, 0.9));
    const geo = new THREE.BoxGeometry(0.55, 0.55, 0.55);
    for (let i = 0; i < 320; i++) {
      const m = new THREE.Mesh(geo, mats[i % mats.length]);
      const row = Math.floor(Math.random() * 6);
      m.position.set(-28 + Math.random() * 56, 0.6 + row * 0.55, -7 - row * 0.9 - Math.random() * 2);
      scene.add(m);
    }
  })();

  // figures: a footballer built from boxes and cylinders
  function limb(r, len, color) {
    const g = new THREE.Group();
    const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 10), mat(color));
    m.position.y = -len / 2;
    g.add(m);
    return g;
  }
  function figure(shirt, shorts, skin, gloves) {
    const root = new THREE.Group();
    const torso = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.62, 0.24), mat(shirt));
    torso.position.y = 1.2; root.add(torso);
    const pants = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.3, 0.24), mat(shorts));
    pants.position.y = 0.78; root.add(pants);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.13, 16, 12), mat(skin));
    head.position.y = 1.66; root.add(head);
    if (gloves) {
      // eyes on the front of the keeper's head, so he visibly faces the shooter
      const eyeMat = mat(0x111111, 0.4);
      [-0.045, 0.045].forEach(x => {
        const eye = new THREE.Mesh(new THREE.SphereGeometry(0.02, 8, 6), eyeMat);
        eye.position.set(x, 1.68, 0.12);
        root.add(eye);
      });
    }
    const armL = limb(0.075, 0.6, shirt); armL.position.set(-0.27, 1.45, 0); root.add(armL);
    const armR = limb(0.075, 0.6, shirt); armR.position.set(0.27, 1.45, 0); root.add(armR);
    const legL = limb(0.1, 0.8, shorts); legL.position.set(-0.12, 0.78, 0); root.add(legL);
    const legR = limb(0.1, 0.8, shorts); legR.position.set(0.12, 0.78, 0); root.add(legR);
    if (gloves) {
      const gL = new THREE.Mesh(new THREE.SphereGeometry(0.09, 12, 10), mat(gloves));
      gL.position.y = -0.62; armL.add(gL);
      const gR = new THREE.Mesh(new THREE.SphereGeometry(0.09, 12, 10), mat(gloves));
      gR.position.y = -0.62; armR.add(gR);
    }
    const shoeMat = mat(0x111111, 0.5);
    [-0.12, 0.12].forEach(x => {
      const shoe = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.08, 0.24), shoeMat);
      shoe.position.set(x, 0.04, 0.04); root.add(shoe);
    });
    scene.add(root);
    return { root, armL, armR, legL, legR };
  }
  // detailed footballer: rounded body, sleeves, socks, boots, hair and a shirt number
  function numberTex(n, color) {
    const c = document.createElement('canvas');
    c.width = 128; c.height = 128;
    const x = c.getContext('2d');
    x.fillStyle = color || '#fff';
    x.font = '900 110px system-ui, sans-serif';
    x.textAlign = 'center';
    x.textBaseline = 'middle';
    x.fillText(String(n), 64, 72);
    return new THREE.CanvasTexture(c);
  }
  function figureV2(c) {
    const root = new THREE.Group();
    const part = (geo, color, rough) => new THREE.Mesh(geo, mat(color, rough));

    // torso, slightly flattened front to back
    const torso = part(new THREE.CylinderGeometry(0.2, 0.165, 0.6, 18), c.shirt);
    torso.position.y = 1.18; torso.scale.z = 0.66; root.add(torso);
    [-0.24, 0.24].forEach(x => {
      const sh = part(new THREE.SphereGeometry(0.11, 12, 10), c.shirt);
      sh.position.set(x, 1.42, 0); root.add(sh);
    });
    const collar = part(new THREE.TorusGeometry(0.075, 0.018, 8, 16), c.collar || 0xffffff);
    collar.rotation.x = Math.PI / 2; collar.position.y = 1.5; root.add(collar);

    // shirt number on the front
    const plate = new THREE.Mesh(
      new THREE.PlaneGeometry(0.2, 0.2),
      new THREE.MeshStandardMaterial({ map: numberTex(c.number, c.numColor), transparent: true, roughness: 0.6 })
    );
    plate.position.set(0, 1.2, 0.14);
    root.add(plate);

    // neck, head and hair
    const neck = part(new THREE.CylinderGeometry(0.05, 0.055, 0.1, 10), c.skin);
    neck.position.y = 1.52; root.add(neck);
    const head = part(new THREE.SphereGeometry(0.13, 18, 14), c.skin);
    head.position.y = 1.66; root.add(head);
    const hair = part(new THREE.SphereGeometry(0.138, 18, 12, 0, Math.PI * 2, 0, Math.PI * 0.5), c.hair);
    hair.position.y = 1.685; hair.rotation.x = -0.25; root.add(hair);
    if (c.keeper) {
      const eyeMat = mat(0x111111, 0.4);
      [-0.045, 0.045].forEach(x => {
        const eye = new THREE.Mesh(new THREE.SphereGeometry(0.02, 8, 6), eyeMat);
        eye.position.set(x, 1.68, 0.12);
        root.add(eye);
      });
    }

    // shorts
    const shorts = part(new THREE.CylinderGeometry(0.19, 0.17, 0.26, 18), c.shorts);
    shorts.position.y = 0.82; shorts.scale.z = 0.7; root.add(shorts);

    // arms: pivot at the shoulder, sleeve, then bare forearm and hand
    function arm(side) {
      const pivot = new THREE.Group();
      pivot.position.set(side * 0.26, 1.42, 0);
      const upper = part(new THREE.CylinderGeometry(0.07, 0.065, 0.32, 10), c.shirt);
      upper.position.y = -0.16; pivot.add(upper);
      const elbow = new THREE.Group();
      elbow.position.y = -0.32; pivot.add(elbow);
      const fore = part(new THREE.CylinderGeometry(0.06, 0.05, 0.28, 10), c.skin);
      fore.position.y = -0.14; elbow.add(fore);
      const hand = part(new THREE.SphereGeometry(0.05, 10, 8), c.skin);
      hand.position.y = -0.3; elbow.add(hand);
      if (c.gloves) {
        const glove = part(new THREE.SphereGeometry(0.085, 12, 10), c.gloves);
        glove.position.y = -0.3; elbow.add(glove);
      }
      root.add(pivot);
      return pivot;
    }
    const armL = arm(-1), armR = arm(1);

    // legs: pivot at the hip, thigh, knee, socks, boot with a white stripe
    function leg(side) {
      const hip = new THREE.Group();
      hip.position.set(side * 0.12, 0.78, 0);
      const thigh = part(new THREE.CylinderGeometry(0.1, 0.085, 0.38, 12), c.shorts);
      thigh.position.y = -0.19; hip.add(thigh);
      const knee = new THREE.Group();
      knee.position.y = -0.38; hip.add(knee);
      const shin = part(new THREE.CylinderGeometry(0.08, 0.07, 0.3, 12), c.socks);
      shin.position.y = -0.15; knee.add(shin);
      const boot = part(new THREE.BoxGeometry(0.15, 0.12, 0.28), 0x101418);
      boot.position.set(0, -0.32, 0.04); knee.add(boot);
      const stripe = part(new THREE.BoxGeometry(0.152, 0.02, 0.1), 0xffffff);
      stripe.position.set(0, -0.28, 0.08); knee.add(stripe);
      root.add(hip);
      return hip;
    }
    const legL = leg(-1), legR = leg(1);

    scene.add(root);
    return { root, armL, armR, legL, legR };
  }
  const userShooter = figureV2({ shirt: 0x1d5fd6, shorts: 0xffffff, socks: 0x1d5fd6, skin: 0xc68642, hair: 0x1a1009, number: 9, collar: 0x0d3a94 });
  const aiShooter = figureV2({ shirt: 0xd62e2e, shorts: 0xffffff, socks: 0xd62e2e, skin: 0x8d5524, hair: 0x0b0b0b, number: 10, collar: 0x8a1414 });
  const keeper = figureV2({ shirt: 0xffd21f, shorts: 0x222222, socks: 0x222222, skin: 0xc68642, hair: 0x3b2412, number: 1, numColor: '#222', gloves: 0x39ff14, keeper: true, collar: 0x222222 });

  // ball with a few dark panels
  const ballGroup = new THREE.Group();
  ballGroup.add(new THREE.Mesh(new THREE.SphereGeometry(0.11, 20, 16), mat(0xffffff, 0.35)));
  const panelMat = mat(0x1d2433, 0.5);
  for (let i = 0; i < 6; i++) {
    const v = new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).normalize().multiplyScalar(0.105);
    const p = new THREE.Mesh(new THREE.SphereGeometry(0.035, 8, 6), panelMat);
    p.position.copy(v);
    ballGroup.add(p);
  }
  scene.add(ballGroup);
  const shadow = new THREE.Mesh(
    new THREE.CircleGeometry(0.16, 16),
    new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.4, depthWrite: false })
  );
  shadow.rotation.x = -Math.PI / 2;
  scene.add(shadow);

  // camera positions: user behind the shooter, AI view behind the keeper
  const CAM = {
    user: { pos: new THREE.Vector3(0, 2.7, 21), look: new THREE.Vector3(0, 1.1, 2) },
    // same side as the keeper's face, so left and right on screen match the goal
    ai:   { pos: new THREE.Vector3(0, 2.7, 21), look: new THREE.Vector3(0, 1.1, 2) }
  };
  const camPos = CAM.user.pos.clone();
  const camLook = CAM.user.look.clone();
  camera.position.copy(camPos);
  camera.lookAt(camLook);

  // projection of a 3D point to logical 480x640 space (for the 2D overlay)
  const _v = new THREE.Vector3();
  function proj(x, y, z) {
    _v.set(x, y, z).project(camera);
    return { x: (_v.x + 1) / 2 * W, y: (1 - _v.y) / 2 * H };
  }

  function resize() {
    const w = wrap.clientWidth, h = wrap.clientHeight;
    if (!w || !h) return;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    renderer.setPixelRatio(dpr);
    renderer.setSize(w, h, false);
    uiCanvas.width = Math.round(w * dpr);
    uiCanvas.height = Math.round(h * dpr);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);

  // ---------- update ----------
  function update(dt) {
    S.time += dt;
    S.shake = Math.max(0, S.shake - dt * 25);
    if (S.banner) { S.banner.life -= dt; if (S.banner.life <= 0) S.banner = null; }
    S.particles.forEach(p => {
      p.x += p.vx * dt * 60;
      p.y += p.vy * dt * 60;
      p.vy += dt * 40;
      p.life -= dt * 0.9;
    });
    S.particles = S.particles.filter(p => p.life > 0);

    const P = PLAYERS[S.player];
    const d = difficulty();
    if (S.state === 'aim') {
      S.aimX = 240 + 150 * Math.sin(S.time * (P.aimSpeed + d * 1.6));
    } else if (S.state === 'power') {
      S.pw = (Math.sin(S.time * (P.pwSpeed + d * 2)) + 1) / 2;
    } else if (S.state === 'dive') {
      S.diveT -= dt;
      if (S.diveT <= 0) startAIShot();
    } else if (S.state === 'flight') {
      if (S.kickWait > 0) {
        S.kickWait -= dt;                  // shooter is running up and striking
      } else {
        S.flightT = Math.min(1, S.flightT + dt / FLIGHT);
        if (S.flightT >= 1) resolveShot();
      }
    } else if (S.state === 'result') {
      S.resultT -= dt;
      if (S.resultT <= 0) finishKick();
    }

    S.keeperX += (S.keeperTarget - S.keeperX) * Math.min(1, dt * 9);
  }

  // ---------- 3D update ----------
  const ease = t => t * t * (3 - 2 * t);
  function updateScene(dt) {
    // shooter: run-up then strike
    const showUser = S.shooter === 'user';
    userShooter.root.visible = showUser;
    aiShooter.root.visible = !showUser;
    const sh = showUser ? userShooter : aiShooter;
    if (S.shooterActive) S.shooterT += dt;

    let sz = 12.2;
    let rightLeg = 0, leftLeg = 0, armSwing = 0;
    if (S.shooterActive && S.shooterT < RUN_TIME) {
      const k = ease(S.shooterT / RUN_TIME);
      sz = 18 + (12.2 - 18) * k;
      const swing = Math.sin(S.shooterT * 18) * 0.8;
      leftLeg = swing; rightLeg = -swing; armSwing = swing * 0.6;
    } else if (S.shooterActive) {
      const k = Math.min(1, (S.shooterT - RUN_TIME) / 0.2);
      rightLeg = 1.3 * k;                  // strike through the ball
      leftLeg = 0.15;
      sz = 12.2 - 0.2 * k;
    }
    sh.root.position.set(0, 0, sz);
    sh.legL.rotation.x = leftLeg;
    sh.legR.rotation.x = rightLeg;
    sh.armL.rotation.x = -armSwing;
    sh.armR.rotation.x = armSwing;

    // keeper: leans and raises arms toward his dive
    const lean = Math.max(-1, Math.min(1, (S.keeperX - 240) / 90));
    keeper.root.position.set(pxToW(S.keeperX), 0, 0.4);
    keeper.root.rotation.z = -lean * 0.8;
    const diving = S.shooter === 'ai' && (S.state === 'flight' || S.state === 'dive');
    keeper.armL.rotation.z = diving ? -2.6 : -0.6;
    keeper.armR.rotation.z = diving ? 2.6 : 0.6;

    // ball
    let bx = 0, by = 0.11, bz = SPOT_Z;
    const flying = (S.state === 'flight' && S.kickWait <= 0) || S.state === 'result';
    if (flying && S.state !== 'result' || (S.state === 'result' && S.flightT > 0)) {
      const e = S.flightT;
      // a save ends at the keeper's gloves, not behind his head
      let endX = pxToW(S.tx), endY = tyToH(S.ty), endZ = -0.3;
      if (S.saved) {
        const kx = pxToW(S.keeperX);
        endX = kx + Math.max(-0.6, Math.min(0.6, endX - kx));
        endY = Math.max(1.0, Math.min(2.0, endY));
        endZ = 0.5;
      }
      bx = endX * e;
      bz = SPOT_Z + (endZ - SPOT_Z) * e;
      by = 0.11 + (endY - 0.11) * e + 0.2 * Math.sin(Math.PI * e);
      ballGroup.rotation.x = e * 14;
    }
    ballGroup.position.set(bx, by, bz);
    shadow.position.set(bx, 0.01, bz);
    shadow.scale.setScalar(Math.max(0.4, 1 - by * 0.35));

    // camera follows whose kick it is
    const target = CAM[S.shooter === 'ai' ? 'ai' : 'user'];
    const k = 1 - Math.pow(0.02, dt);
    camPos.lerp(target.pos, k);
    camLook.lerp(target.look, k);
    camera.position.copy(camPos);
    camera.lookAt(camLook);
    if (S.shake > 0) {
      camera.position.x += (Math.random() - 0.5) * S.shake * 0.02;
      camera.position.y += (Math.random() - 0.5) * S.shake * 0.02;
    }
  }

  // ---------- 2D overlay ----------
  function reticleUI(x, y, alpha) {
    uiCtx.globalAlpha = alpha;
    uiCtx.strokeStyle = alpha < 1 ? '#ffd33d' : '#ffffff';
    uiCtx.lineWidth = 3;
    uiCtx.beginPath(); uiCtx.arc(x, y, 18, 0, Math.PI * 2); uiCtx.stroke();
    uiCtx.beginPath();
    uiCtx.moveTo(x - 28, y); uiCtx.lineTo(x - 10, y);
    uiCtx.moveTo(x + 10, y); uiCtx.lineTo(x + 28, y);
    uiCtx.moveTo(x, y - 28); uiCtx.lineTo(x, y - 10);
    uiCtx.moveTo(x, y + 10); uiCtx.lineTo(x, y + 28);
    uiCtx.stroke();
    uiCtx.globalAlpha = 1;
  }

  function drawHUD() {
    uiCtx.fillStyle = 'rgba(0,0,0,.55)';
    uiCtx.fillRect(0, 0, W, 86);
    uiCtx.textBaseline = 'middle';

    uiCtx.font = '800 20px system-ui, sans-serif';
    uiCtx.textAlign = 'left';
    uiCtx.fillStyle = '#5dff8a';
    uiCtx.fillText('YOU ' + S.userG, 16, 22);
    uiCtx.textAlign = 'right';
    uiCtx.fillStyle = '#ff8a8a';
    uiCtx.fillText('AI ' + S.aiG, 464, 22);

    uiCtx.textAlign = 'center';
    if (isSuddenDeath()) {
      uiCtx.fillStyle = '#ff6b6b';
      uiCtx.fillText('SUDDEN DEATH', 240, 22);
    } else {
      uiCtx.fillStyle = S.streak >= 2 ? '#ffd33d' : '#aab';
      uiCtx.fillText('STREAK ' + S.streak + (S.streak >= 3 ? ' 🔥' : ''), 240, 22);
    }

    for (let i = 0; i < KICKS; i++) {
      const ux = 20 + i * 20, uy = 56;
      const ur = S.userRes[i];
      uiCtx.beginPath(); uiCtx.arc(ux, uy, 7, 0, Math.PI * 2);
      if (ur === 'g') { uiCtx.fillStyle = '#5dff8a'; uiCtx.fill(); }
      else if (ur === 's') { uiCtx.fillStyle = '#ffa940'; uiCtx.fill(); }
      else if (ur === 'x') { uiCtx.fillStyle = '#ff6b6b'; uiCtx.fill(); }
      else { uiCtx.strokeStyle = 'rgba(255,255,255,.4)'; uiCtx.lineWidth = 2; uiCtx.stroke(); }

      const ax = 460 - (KICKS - 1 - i) * 20;
      const ar = S.aiRes[i];
      uiCtx.beginPath(); uiCtx.arc(ax, uy, 7, 0, Math.PI * 2);
      if (ar === 'g') { uiCtx.fillStyle = '#ff6b6b'; uiCtx.fill(); }
      else if (ar === 's') { uiCtx.fillStyle = '#5dff8a'; uiCtx.fill(); }
      else if (ar === 'x') { uiCtx.fillStyle = '#cfd6e6'; uiCtx.fill(); }
      else { uiCtx.strokeStyle = 'rgba(255,255,255,.4)'; uiCtx.lineWidth = 2; uiCtx.stroke(); }
    }
    uiCtx.textAlign = 'center';
    uiCtx.fillStyle = '#ccd';
    uiCtx.font = '600 12px system-ui, sans-serif';
    uiCtx.fillText('PTS ' + S.score, 240, 56);

    const d = difficulty();
    uiCtx.fillStyle = 'rgba(255,255,255,.15)';
    uiCtx.fillRect(0, 82, W, 4);
    uiCtx.fillStyle = d > 0.66 ? '#ff6b6b' : (d > 0.33 ? '#ffd33d' : '#5dff8a');
    uiCtx.fillRect(0, 82, W * d, 4);
    uiCtx.textBaseline = 'alphabetic';
  }

  function drawUI() {
    const s = uiCanvas.width / W;
    uiCtx.setTransform(s, 0, 0, s, 0, 0);
    uiCtx.clearRect(0, 0, W, H);

    // aim reticle sits on the goal where the shot would go
    if (S.state === 'aim') {
      const p = proj(pxToW(S.aimX), 1.2, 0);
      reticleUI(p.x, p.y, 1);
      uiCtx.textAlign = 'center';
      uiCtx.font = '700 14px system-ui, sans-serif';
      uiCtx.fillStyle = '#fff';
      uiCtx.fillText('YOUR KICK · ' + PLAYERS[S.player].name + ' · TAP TO AIM', 240, 330);
    }

    if (S.state === 'power') {
      const ty = 252 - S.pw * PLAYERS[S.player].maxPow * 136;
      const p = proj(pxToW(S.lockedX), tyToH(ty), 0);
      reticleUI(p.x, p.y, 0.6);
      const x = 60, y = 600, w = 360, h = 16;
      uiCtx.fillStyle = 'rgba(0,0,0,.55)';
      uiCtx.fillRect(x - 4, y - 4, w + 8, h + 8);
      const pg = uiCtx.createLinearGradient(x, 0, x + w, 0);
      pg.addColorStop(0, '#5dff8a'); pg.addColorStop(0.6, '#ffd33d'); pg.addColorStop(1, '#ff6b6b');
      uiCtx.fillStyle = pg;
      uiCtx.fillRect(x, y, w * S.pw, h);
      uiCtx.fillStyle = '#fff';
      uiCtx.fillRect(x + w * S.pw - 2, y - 6, 4, h + 12);
      uiCtx.textAlign = 'center';
      uiCtx.font = '700 13px system-ui, sans-serif';
      uiCtx.fillText('POWER: TAP', 240, 590);
    }

    if (S.state === 'dive') {
      // highlight the zone the keeper is diving to
      ZONE_BANDS.forEach(z => {
        const a = proj(pxToW(z.x0), 0, 0), b = proj(pxToW(z.x1), BAR_H, 0);
        const chosen = S.keeperTarget === z.c;
        uiCtx.fillStyle = chosen ? 'rgba(255,211,61,.28)' : 'rgba(255,255,255,.07)';
        uiCtx.fillRect(a.x, b.y, b.x - a.x, a.y - b.y);
        const lp = proj(pxToW(z.c), 0.5, 0);
        uiCtx.textAlign = 'center';
        uiCtx.font = '800 13px system-ui, sans-serif';
        uiCtx.fillStyle = chosen ? '#ffd33d' : 'rgba(255,255,255,.85)';
        uiCtx.fillText(z.label, lp.x, lp.y);
      });
      uiCtx.textAlign = 'center';
      uiCtx.font = '700 14px system-ui, sans-serif';
      uiCtx.fillStyle = '#fff';
      uiCtx.fillText('AI IS SHOOTING · TAP A ZONE TO DIVE', 240, 330);
      uiCtx.fillStyle = 'rgba(255,255,255,.2)';
      uiCtx.fillRect(80, 560, 320, 6);
      uiCtx.fillStyle = '#ffd33d';
      uiCtx.fillRect(80, 560, 320 * Math.max(0, S.diveT / DIVE_TIME), 6);
    }

    S.particles.forEach(p => {
      uiCtx.globalAlpha = Math.max(0, p.life);
      uiCtx.fillStyle = p.c;
      uiCtx.fillRect(p.x, p.y, 5, 5);
    });
    uiCtx.globalAlpha = 1;

    if (S.banner) {
      const b = S.banner;
      const t = 1 - b.life / b.max;
      const scale = t < 0.15 ? 0.6 + (t / 0.15) * 0.5 : 1.1 - Math.min(0.1, (t - 0.15) * 0.2);
      uiCtx.save();
      uiCtx.translate(240, 180);
      uiCtx.scale(scale, scale);
      uiCtx.globalAlpha = Math.min(1, b.life * 2.5);
      uiCtx.textAlign = 'center';
      uiCtx.font = '900 42px system-ui, sans-serif';
      uiCtx.lineWidth = 8; uiCtx.strokeStyle = 'rgba(0,0,0,.75)';
      uiCtx.strokeText(b.text, 0, 0);
      uiCtx.fillStyle = b.color;
      uiCtx.fillText(b.text, 0, 0);
      uiCtx.restore();
    }

    drawHUD();
  }

  // ---------- loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (S.state !== 'menu') update(dt);
    else {
      S.time += dt;
      S.particles.forEach(p => { p.x += p.vx * dt * 60; p.y += p.vy * dt * 60; p.vy += dt * 40; p.life -= dt * 0.9; });
      S.particles = S.particles.filter(p => p.life > 0);
    }
    updateScene(dt);
    renderer.render(scene, camera);
    drawUI();
    requestAnimationFrame(frame);
  }

  resize();
  showMenu();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
